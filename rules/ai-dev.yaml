# Список доменов ИИ-сервисов и инструментов разработчика.
#
# Подключается в stargate.yaml как rule-provider misc-ai (behavior: classical)
# и отправляется в группу "AI & Разработка". Отдельные провайдеры (openai,
# anthropic, perplexity, google-gemini, microsoft) берутся из MetaCubeX — здесь
# то, чего у них нет: консоли разработчика, песочницы, CDN и API-хосты.
#
# Формат: Clash classical (payload со списком доменов).
# Правка: добавьте домен в payload и перезапустите контейнер - провайдер
# перечитается по своему интервалу (86400 ч, то есть раз в сутки).

payload:
  # --- консоли и панели ИИ ---
  - chat.openai.com
  - platform.openai.com
  - openai.com
  - oaistatic.com
  - oaiusercontent.com
  - sora.com
  - claude.ai
  - console.anthropic.com
  - anthropic.com
  - perplexity.ai
  - labs.google
  - ai.google.dev
  - gemini.google.com
  - generativelanguage.googleapis.com
  - ai.azure.com
  - copilot.microsoft.com
  - copilot.cloud.microsoft
  - githubcopilot.com
  - huggingface.co
  - hf.co
  - replicate.com
  - together.ai
  - groq.com
  - mistral.ai
  - poe.com
  - you.com
  - phind.com
  - cursor.sh
  - cursor.com
  - windsurf.dev
  - codeium.com
  - tabnine.com

  # --- API-хосты, часто не покрытые geosite ---
