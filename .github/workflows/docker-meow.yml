# Builds the meow image (root Dockerfile) for linux/amd64, linux/arm64 and
# linux/arm/v7 and pushes a combined multi-arch manifest to GHCR.
#
# MANUAL ONLY: this workflow never runs on push or tags — dispatch it from
# the Actions tab (or `gh workflow run docker-meow.yml [-f meow_version=v0.29.0]`).
#
# The MEOW_VERSION input picks the meow-rs version, exactly like the
# MEOW_VERSION build arg of Dockerfile: `latest` (default) resolves the newest
# upstream RELEASE through the GitHub API for ALL three platforms — arm/v7
# included, since v0.29.0 upstream ships a static musl armv7 binary; a tag
# (e.g. v0.29.0) pins one. The input value (whitespace-trimmed) is also applied
# as an image tag, so a pinned build is addressable :v0.29.0.
#
# Strategy: ONE job cross-builds all three platforms on a single amd64 runner —
# nothing is compiled anywhere, every platform downloads a release binary. The
# download stage is pinned to $BUILDPLATFORM: it always runs natively on the
# host and never executes the target binary, so QEMU binfmt is needed only for
# the runtime stage's apk (the arm64 and arm/v7 alpine roots are provisioned
# under emulation). Buildx pushes the combined manifest list directly — no
# matrix, no per-platform digests, no artifacts, no merge job. The resulting
# manifest-list digest is attested with actions/attest-build-provenance.
#
# Resulting tags:
#   MEOW_VERSION=latest  -> latest, main, sha-<shortsha>
#   MEOW_VERSION=v0.29.0 -> v0.29.0, main, sha-<shortsha>
#

name: Docker meow

on:
  workflow_dispatch:
    inputs:
      meow_version:
        description: "meow-rs release to package (tag like v0.29.0, or latest)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write
  # Required by actions/attest-build-provenance (OIDC token + writing
  # the attestation to the registry).
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare
        env:
          MEOW_INPUT: ${{ inputs.meow_version }}
        run: |
          echo "MEOW_VERSION=${MEOW_INPUT//[[:space:]]/}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image name
        id: image
        run: |
          echo "name=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      # The download stage runs on BUILDPLATFORM (native) and the amd64 runtime
      # stage matches the runner, so emulation covers only the arm64 and arm/v7
      # runtime stages' apk.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ env.MEOW_VERSION }}

      # Deliberately NO gha cache: the RUN layers key on the resolved
      # MEOW_VERSION value, so with `latest` a rerun would restore the previous
      # release's binary from cache and push it under fresh tags. The whole
      # build is a download — cache saves seconds at most. Always re-resolve
      # and re-download.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            MEOW_VERSION=${{ env.MEOW_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      # One attestation on the manifest-list digest covers all three
      # architectures.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
