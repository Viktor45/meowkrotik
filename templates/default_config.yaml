##### template blocks #####
health-check-template: &health-check
    enable: $HEALTH_CHECK_ENABLE
    url: $HEALTH_CHECK_URL
    interval: $HEALTH_CHECK_INTERVAL
    timeout: $HEALTH_CHECK_TIMEOUT
    lazy: $HEALTH_CHECK_LAZY
    expected-status: $HEALTH_CHECK_EXPECTED_STATUS
###########################
external-controller: $EXTERNAL_CONTROLLER_ADDRESS:$UI_PORT
external-ui: $EXTERNAL_UI_PATH
external-ui-url: $EXTERNAL_UI_URL
secret: $UI_SECRET
unified-delay: $UNIFIED_DELAY
log-level: $LOG_LEVEL
ipv6: $IPV6
find-process-mode: $FIND_PROCESS_MODE
tcp-concurrent: $TCP_CONCURRENT
keep-alive-idle: $KEEP_ALIVE_IDLE
keep-alive-interval: $KEEP_ALIVE_INTERVAL

profile:
  store-selected: $STORE_SELECTED

# Геобазы (GEOIP/GEOSITE) шаблону не нужны, и с 0.27 meow-rs качает только
# те базы, на которые конфиг ссылается, - так что при старте загрузок нет
# вовсе. Если добавить сюда GEOIP- или GEOSITE-правило, нужная база один
# раз скачается в рабочую папку сама; секцию geodata прописывать не нужно.

dns:
  enable: $DNS_ENABLE
  use-system-hosts: $DNS_USE_SYSTEM_HOSTS
  listen: $DNS_LISTEN
  cache-algorithm: $DNS_CACHE_ALGORITHM
  prefer-h3: $DNS_PREFER_H3
  enhanced-mode: $DNS_ENHANCED_MODE
  fake-ip-range: $DNS_FAKE_IP_RANGE
  fake-ip-ttl: $DNS_FAKE_IP_TTL
  # meow-rs не поддерживает спец-строку "system" из mihomo — серверы задаются
  # явно через переменную окружения DNS_NAMESERVERS (по умолчанию 1.1.1.1,8.8.8.8):
  #   DNS_NAMESERVERS="1.1.1.1,8.8.8.8,9.9.9.9"
  # entrypoint превращает её в этот YAML-список.
  nameserver:
$DNS_NAMESERVERS_LIST

proxy-providers:
$PROVIDERS_BLOCK

proxy-groups:
  - name: SELECTOR
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - MANUAL
      - LOADBALANCE
      - DIRECT
  
  - name: AUTO
    type: url-test
    use:
$PROVIDERS_LIST
    <<: *health-check
    lazy: false
    tolerance: $TOLERANCE

  - name: FALLBACK
    type: fallback
    use:
$PROVIDERS_LIST
    <<: *health-check

  - name: MANUAL
    type: select
    use:
$PROVIDERS_LIST

  - name: LOADBALANCE
    type: load-balance
    strategy: $LOADBALANCE_STRATEGY
    use:
$PROVIDERS_LIST
    <<: *health-check

  - name: QUIC UDP 443
    type: select
    # PASS — встроенный noop-адаптер meow-rs: правило пропускается тихо
    proxies:
      - PASS
      - REJECT

listeners:
  - name: mixed-in
    type: mixed
    port: $MIXED_PORT
$TUN_IN_AUTOCONFIG

rules:
  - AND,((NETWORK,udp),(DST-PORT,443)),QUIC UDP 443
  # meow-rs: вход TUN называется "meow-tun", tproxy-прослушиватель — "tun-in"
  - IN-NAME,meow-tun,SELECTOR
  - IN-NAME,tun-in,SELECTOR
  - IN-NAME,mixed-in,SELECTOR
  - MATCH,GLOBAL