# ============================================================================
# === БАЗОВЫЕ ШАБЛОНЫ ПРАВИЛ (RULE PROVIDER BASES) ===
# ============================================================================

# Комбинации behavior + format для разных типов провайдеров правил
# ВАЖНО для meow-rs: якоря описаны ПОЛНОСТЬЮ, без вложенных merge-ключей.
# Парсер meow-rs не разворачивает якорь, внутри которого сам стоит `<<:`
# (типичный «двухуровневый» якорь) — конфиг падает с missing field `type`.
rule_behavior_domain_mrs: &rule_behavior_domain_mrs
  type: http
  interval: 86400
  behavior: domain    # Тип правила: домены
  format: mrs         # Формат: Meta Ruleset

rule_behavior_domain_yaml: &rule_behavior_domain_yaml
  type: http
  interval: 86400
  behavior: domain    # Тип правила: домены
  format: yaml        # Формат: YAML

rule_behavior_ipcidr_mrs: &rule_behavior_ipcidr_mrs
  type: http
  interval: 86400
  behavior: ipcidr    # Тип правила: IP-диапазоны
  format: mrs         # Формат: Meta Ruleset

rule_behavior_ipcidr_yaml: &rule_behavior_ipcidr_yaml
  type: http
  interval: 86400
  behavior: ipcidr    # Тип правила: IP-диапазоны
  format: yaml        # Формат: YAML

# Специальный шаблон для классических правил (torrent-clients)
rule_behavior_classical_yaml: &rule_behavior_classical_yaml
  type: http
  interval: 86400
  behavior: classical   # Тип правила: классический
  format: yaml          # Формат: YAML

# ============================================================================
# === ГРУППЫ ПРОКСИ (PROXY GROUPS) ===
# ============================================================================

# Группы определяют логику выбора прокси для различных сценариев
# Типы групп: select (ручной), url-test (скорость), fallback (резерв), load-balance (баланс)
proxy-groups:
    # --------------------------------------------------------------------------
    # ГЛАВНЫЙ СЕЛЕКТОР - основная точка выбора в веб-интерфейсе
    # --------------------------------------------------------------------------
  - name: SELECTOR
    type: select          # Ручной выбор пользователем
    include-all: true     # Включить все доступные прокси
    proxies:
      - AUTO
      - LOADBALANCE
      - MANUAL
      - RU_AUTO
      - RU_LOADBALANCE
      - RU_MANUAL
      - DIRECT

    # --------------------------------------------------------------------------
    # БАЗОВЫЕ АВТОМАТИЧЕСКИЕ ГРУППЫ (ИНОСТРАННЫЕ ПРОКСИ)
    # --------------------------------------------------------------------------

    # AUTO - полностью автоматический выбор (иностранные)
    # Приоритет: FASTEST → FAILOVER → MANUAL → DIRECT
  - name: AUTO
    type: fallback                  # Переключение при отказе
    proxies:
      - FASTEST
      - FAILOVER
      - MANUAL
      - DIRECT
    <<: *health_check               # Параметры проверки

    # FASTEST - автоматически выбирает самый быстрый прокси по задержке
  - name: FASTEST
    type: url-test                  # Тестирование скорости
    use: *providers_list            # Использовать провайдеры
    exclude-filter: *exclude_ru     # Исключить российские серверы
    <<: *url_test                   # Параметры тестирования

    # FAILOVER - резервный прокси при отказе основного
  - name: FAILOVER
    type: fallback                  # Переключение при отказе
    use: *providers_list            # Использовать провайдеры
    exclude-filter: *exclude_ru     # Исключить российские серверы
    <<: *health_check               # Параметры проверки

    # LOADBALANCE - балансировка по нагрузке
  - name: LOADBALANCE
    type: load-balance              # Балансировка нагрузки
    strategy: $LOADBALANCE_STRATEGY # Стратегия балансировки (round-robin, consistent-hashing, sticky-sessions)
    use: *providers_list            # Использовать провайдеры
    exclude-filter: *exclude_ru     # Исключить российские серверы
    <<: *health_check               # Параметры тестирования
    hidden: false                   # Показывать в интерфейсе

    # MANUAL - ручной выбор иностранного прокси
  - name: MANUAL
    type: select                    # Ручной выбор
    use: *providers_list            # Использовать провайдеры
    exclude-filter: *exclude_ru     # Исключить российские серверы

    # --------------------------------------------------------------------------
    # РОССИЙСКИЕ ПРОКСИ-ГРУППЫ
    # --------------------------------------------------------------------------

    # RU_AUTO - полностью автоматический выбор (российские)
    # Приоритет: RU_FASTEST → RU_FAILOVER → RU_MANUAL → DIRECT
  - name: RU_AUTO
    type: fallback                  # Переключение при отказе
    proxies:
      - RU_FASTEST
      - RU_FAILOVER
      - RU_MANUAL
      - DIRECT
    <<: *health_check               # Параметры проверки

    # RU_MANUAL - ручной выбор российского прокси
  - name: RU_MANUAL
    type: select                    # Ручной выбор
    use: *providers_list            # Использовать провайдеры
    filter: *filter_ru              # Только российские серверы

    # RU_FASTEST - самый быстрый российский прокси
  - name: RU_FASTEST
    type: url-test                  # Тестирование скорости
    use: *providers_list            # Использовать провайдеры
    filter: *filter_ru              # Только российские серверы
    <<: *url_test                   # Параметры тестирования

    # RU_FAILOVER - резервный российский прокси
  - name: RU_FAILOVER
    type: fallback                  # Переключение при отказе
    use: *providers_list            # Использовать провайдеры
    filter: *filter_ru              # Только российские серверы
    <<: *health_check               # Параметры проверки

    # RU_LOADBALANCE - балансировка по нагрузке
  - name: RU_LOADBALANCE
    type: load-balance              # Балансировка нагрузки
    strategy: $LOADBALANCE_STRATEGY # Стратегия балансировки (round-robin, consistent-hashing, sticky-sessions)
    use: *providers_list            # Использовать провайдеры
    filter: *filter_ru              # Только российские серверы
    <<: *health_check               # Параметры тестирования
    hidden: false                   # Показывать в интерфейсе

    # --------------------------------------------------------------------------
    # ГРУППЫ БЕЗ АВТОМАТИЧЕСКИХ ПРАВИЛ
    # --------------------------------------------------------------------------
    # Группы ниже (META, CDN77, DIGITALOCEAN, HETZNER, MEGA, OVH, VULTR) нужны
    # только для ручного выбора в панели: автоматических правил на них больше
    # нет, потому что meow-rs не понимает нестандартные GEOIP-категории ZKEEN,
    # а готовых ipcidr-списков для этих провайдеров не существует.

    # --------------------------------------------------------------------------
    # СИСТЕМНЫЕ ГРУППЫ
    # --------------------------------------------------------------------------

    # GLOBAL - скрытая глобальная группа для правил
  - name: GLOBAL
    type: select                    # Ручной выбор
    hidden: true                    # Скрыть из интерфейса
    icon: *icon_global
    proxies: *proxy_list_all        # Список доступных опций

    # QUIC - обработка QUIC-трафика (UDP/443)
  - name: QUIC
    type: select                    # Ручной выбор
    proxies:
      - PASS                        # Пропустить без изменений
      - REJECT                      # Заблокировать

    # --------------------------------------------------------------------------
    # ГРУППЫ ПО ПРИЛОЖЕНИЯМ/СЕРВИСАМ
    # --------------------------------------------------------------------------

    # TELEGRAM - мессенджер Telegram
  - name: Telegram
    type: select                    # Ручной выбор
    icon: *icon_telegram
    include-all: false              # Только указанные прокси
    proxies: *proxy_list_all        # Список доступных опций

    # WHATSAPP - мессенджер WhatsApp
  - name: WhatsApp
    type: select                    # Ручной выбор
    icon: *icon_whatsapp
    include-all: false              # Только указанные прокси
    proxies: *proxy_list_all        # Список доступных опций

    # RU-TRAFFIC - российский трафик (по GEOIP)
  - name: Ru-Traffic
    type: select                    # Ручной выбор
    icon: *icon_russia
    include-all: false              # Только указанные прокси
    proxies: *proxy_list_all        # Список доступных опций

    # ECH-REFILTER - трафик для ускорения интернета с ECH
  - name: ECH-Refilter
    type: select                    # Ручной выбор
    icon: *icon_direct
    include-all: false              # Только указанные прокси
    proxies: *proxy_list_all        # Список доступных опций

    # META - сервисы Meta (Facebook, Instagram, WhatsApp)
  - name: META
    type: select                    # Ручной выбор
    icon: *icon_facebook
    include-all: false              # Только указанные прокси
    proxies: *proxy_list_all        # Список доступных опций

    # AMAZON - сервисы Amazon (AWS, магазин, Prime)
  - name: AMAZON
    type: select                    # Ручной выбор
    icon: *icon_amazon
    include-all: false              # Только указанные прокси
    proxies: *proxy_list_all        # Список доступных опций

    # FASTLY - CDN-провайдер Fastly
  - name: FASTLY
