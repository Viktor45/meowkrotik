# ============================================================================
# === ПРАВИЛА МАРШРУТИЗАЦИИ (RULES) ===
# ============================================================================

# Основной список правил маршрутизации
# Правила обрабатываются сверху вниз, первое совпадение применяется
# Примечание meow-rs: логические правила AND/OR/NOT не умеют RULE-SET внутри
# себя, поэтому комбинации вида OR,((RULE-SET,a),(RULE-SET,b)),X записаны
# двумя последовательными правилами — результат тот же (первое совпадение)
rules:
    # Локальная сеть - всегда напрямую (без прокси)
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve        # Частная сеть Class A, RFC1918
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve     # Сеть оператора RFC6598
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve       # Loopback (localhost), RFC1700
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve    # Link local, RFC3330
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve     # Частная сеть Class B, RFC1918
  - IP-CIDR,192.0.0.0/24,DIRECT,no-resolve      # Reserved, RFC3330
  - IP-CIDR,192.0.2.0/24,DIRECT,no-resolve      # Testnet, RFC3330
  - IP-CIDR,192.88.99.0/24,DIRECT,no-resolve    # Anycast 6to4, RFC3068
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve    # Частная сеть Class C, RFC1918
  - IP-CIDR,198.18.0.0/15,DIRECT,no-resolve     # Benchmark, RFC3330
  - IP-CIDR,198.51.100.0/24,DIRECT,no-resolve   # Testnet, RFC5735
  - IP-CIDR,203.0.113.0/24,DIRECT,no-resolve    # Testnet, RFC5735
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve       # Multicast, RFC3171
  - DOMAIN-SUFFIX,home.arpa,DIRECT              # Локальный префикс RFC8375
  - DOMAIN-SUFFIX,internal,DIRECT
  - DOMAIN-SUFFIX,localdomain,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT

    # Безопасность: блокировка уязвимых UDP портов
    #  - AND,((NETWORK,udp),(DST-PORT,135)),REJECT
    #  - AND,((NETWORK,udp),(DST-PORT,137)),REJECT
    #  - AND,((NETWORK,udp),(DST-PORT,138)),REJECT
    #  - AND,((NETWORK,udp),(DST-PORT,139)),REJECT
    # QUIC-трафик (UDP/443) - специальная обработка
  - AND,((NETWORK,udp),(DST-PORT,443)),QUIC

    # Реклама / NSFW
    #  - RULE-SET,oisd_small,Ad-Filter
    #  - RULE-SET,oisd_big,Ad-Filter
    #  - RULE-SET,oisd_nsfw_small,Ad-Filter
    #  - RULE-SET,oisd_nsfw_big,Ad-Filter
    # Проверка IP - через прокси для анонимности
  - OR,((DOMAIN,ipwho.is),(DOMAIN,api.ip.sb),(DOMAIN,ipapi.co),(DOMAIN,ipinfo.io),(DOMAIN,2ip.io),(DOMAIN,2ip.ru)),SELECTOR

    # Торренты - приоритетная маршрутизация
  - RULE-SET,torrent-clients,Torrent-Traffic
  - RULE-SET,torrent-trackers,Torrent-Traffic
  - RULE-SET,torrent-websites,Torrent-Traffic

    # ИИ и инструменты разработки - приоритетная маршрутизация
  - RULE-SET,misc-ai,AI & Разработка

    # Мессенджеры и коммуникационные сервисы
  - RULE-SET,telegram-domains,Telegram
  - RULE-SET,telegram-ips,Telegram
  - RULE-SET,whatsapp-domains,WhatsApp
  - RULE-SET,whatsapp-ips,WhatsApp
  - RULE-SET,discord-domains,Discord
  - RULE-SET,discord-voiceips,Discord

    # Игровые платформы
  - RULE-SET,steam-domains,Steam
  - RULE-SET,steam-ips,Steam

    # ИИ-сервисы (по порядку приоритета)
  - RULE-SET,anthropic,Anthropic
  - RULE-SET,perplexity,Perplexity
  - RULE-SET,google-gemini,GoogleGemini
  - RULE-SET,openai,OpenAI
  - RULE-SET,microsoft,Microsoft

    # Стриминг и видео
  - RULE-SET,twitch-domains,Twitch
  - RULE-SET,youtube,YouTube

    # CDN и облачные сервисы (ipcidr-списки: у meow-rs GEOIP понимает
    # только ISO-коды стран, нестандартные категории ZKEEN не поддерживаются)
  - RULE-SET,cdn-akamai,AKAMAI
  - RULE-SET,cdn-amazon,AMAZON
  - RULE-SET,cdn-fastly,FASTLY
  - RULE-SET,cdn-google,GOOGLE
  - RULE-SET,cdn-cloudflare,CLOUDFLARE

    # Правила для ускорения интернета с ECH
  - DOMAIN,cloudflare-ech.com,SELECTOR
  - RULE-SET,refilter-ech,DIRECT
  - RULE-SET,refilter-noech,ECH-Refilter
  - RULE-SET,refilter-ipsum,ECH-Refilter

    # Облачные провайдеры и хостинги
